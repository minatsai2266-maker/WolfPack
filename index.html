<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公會佈達站</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jodit@4.17.1/es2021/jodit.fat.min.css">
<style>
/* =========================================================
   設定區：公會名稱改這裡
   ========================================================= */
:root{
  --bg:#f4efe4; --surface:#fffdf8; --surface-2:#efe7d6; --text:#2a2418; --muted:#6d6250;
  --line:#ddd2bc; --accent:#9a6b12; --accent-ink:#fff; --danger:#b3261e; --ok:#2e7d32;
  --header:#1d2333; --header-ink:#f3e6c4; --tab:#c9b48a;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161f; --surface:#1c2030; --surface-2:#262b3d; --text:#ece6d6; --muted:#a59d8a;
    --line:#333a50; --accent:#d7a640; --accent-ink:#1a1408; --danger:#ef7b73; --ok:#7bc47f;
    --header:#0d1018; --header-ink:#f3e6c4; --tab:#8c8068;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161f; --surface:#1c2030; --surface-2:#262b3d; --text:#ece6d6; --muted:#a59d8a;
  --line:#333a50; --accent:#d7a640; --accent-ink:#1a1408; --danger:#ef7b73; --ok:#7bc47f;
  --header:#0d1018; --header-ink:#f3e6c4; --tab:#8c8068;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}

header.site{background:var(--header);color:var(--header-ink)}
.bar{max-width:1080px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.crest{width:34px;height:34px;flex:none}
.brand h1{margin:0;font-size:20px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tab)}
.who .btn{border-color:#ffffff33;color:var(--header-ink);background:transparent}
nav.tabs{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:transparent;color:var(--tab);padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:15px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--text);font-weight:700}
nav.tabs button:hover:not([aria-selected="true"]){color:var(--header-ink)}

main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.demo-note{background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--radius);padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:16px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.head-row h2{margin:0;font-size:22px}
.meta{font-size:13px;color:var(--muted)}

.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:18px}
.pin{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:12px;padding:1px 8px;border-radius:99px;margin-right:6px;vertical-align:2px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.open{border-color:var(--ok);color:var(--ok)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* 管理員編的內容：放在固定淺色紙面上，讓管理員選的顏色在深色模式也看得清楚 */
.rich{background:#fffdf8;color:#222;border-radius:8px;padding:16px 18px;overflow-x:auto;word-wrap:break-word}
.rich img{max-width:100%;height:auto}
.rich table{border-collapse:collapse;max-width:100%}
.rich td,.rich th{border:1px solid #bbb;padding:6px 10px;vertical-align:top}
.rich p{margin:.4em 0}
.card .rich{margin-top:10px}

.editor-wrap{margin-top:10px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;color:var(--muted)}
.field input[type=text],.field input[type=email],.field input[type=password],.field input[type=date],.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.inline{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:14px}
.inline label{display:flex;align-items:center;gap:6px}

/* 報名 */
.signup-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px;align-items:end}
.signup-form input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
@media (max-width:640px){.signup-form{grid-template-columns:1fr}}
.list{margin-top:12px;border-top:1px solid var(--line)}
.list-head{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;color:var(--muted)}
table.sl{width:100%;border-collapse:collapse;font-size:14px}
table.sl th,table.sl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.sl th{color:var(--muted);font-weight:500}
.msg{font-size:14px;margin-top:6px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--danger)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:22px;width:min(380px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 14px}

details.thread{padding:0;overflow:hidden}
details.thread>summary{list-style:none;cursor:pointer;padding:14px 20px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
details.thread>summary::-webkit-details-marker{display:none}
details.thread>summary .th-title{font-weight:700;font-size:17px;display:flex;gap:10px;align-items:baseline}
details.thread>summary .th-title::before{content:"▸";color:var(--accent);transition:transform .15s;display:inline-block}
details.thread[open]>summary .th-title::before{transform:rotate(90deg)}
details.thread>summary:hover{background:var(--surface-2)}
details.thread>.rich,details.thread>.actions{margin:0 20px 16px}
.emoji-panel{width:min(340px,calc(100vw - 40px));padding:6px;background:#fff;color:#222}
.emoji-tabs{display:flex;gap:2px;border-bottom:1px solid #e5e5e5;margin-bottom:6px;flex-wrap:wrap}
.emoji-tabs button{border:0;background:none;padding:4px 8px;cursor:pointer;font-size:13px;border-radius:6px 6px 0 0;color:#555}
.emoji-tabs button.on{background:#f3ead6;color:#222;font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:220px;overflow-y:auto}
.emoji-grid button{border:0;background:none;font-size:22px;line-height:1;padding:5px 0;cursor:pointer;border-radius:6px}
.emoji-grid button:hover{background:#f3ead6}
.sheet-embed{margin:10px 0}
.sheet-embed iframe{width:100%;height:min(70vh,640px);border:1px solid #ddd;border-radius:8px;background:#fff}
.sheet-embed .meta{margin-top:4px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:20px}
.jodit-container{color:#222}
</style>
</head>
<body>
<header class="site">
  <div class="bar">
    <div class="brand">
      <svg class="crest" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 6v9c0 7.5 5.1 13 12 15 6.9-2 12-7.5 12-15V6L16 2z" fill="#d7a640"/><path d="M16 7l2.4 5 5.4.6-4 3.7 1.1 5.4L16 19l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z" fill="#1d2333"/></svg>
      <h1 id="siteTitle">公會佈達站</h1>
    </div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="main"></main>
<footer id="foot">內容由管理員維護</footer>

<dialog id="askDlg">
  <p id="askMsg" style="margin:0 0 16px"></p>
  <div class="actions"><button class="btn primary" id="askOk" type="button">確定</button><button class="btn" id="askNo" type="button">取消</button></div>
</dialog>
<dialog id="loginDlg">
  <h3 id="lgTitle">管理員登入</h3>
  <button class="btn" type="button" id="lgGoogle" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
    用 Google 帳號登入</button>
  <div class="meta" style="text-align:center;margin:12px 0">或用 Email 密碼</div>
  <form id="loginForm">
    <div class="field"><label for="lgEmail">Email</label><input id="lgEmail" type="email" required autocomplete="username"></div>
    <div class="field"><label for="lgPw">密碼</label><input id="lgPw" type="password" required autocomplete="current-password"></div>
    <div class="msg" id="lgErr"></div>
    <div class="actions"><button class="btn primary" type="submit" id="lgSubmit">登入</button><button class="btn" type="button" id="lgCancel">取消</button></div>
    <div class="meta" style="margin-top:12px">
      <a href="#" id="lgToReg">第一次使用？設定密碼</a> · <a href="#" id="lgForgot">忘記密碼</a>
    </div>
  </form>
</dialog>

<!-- =========================================================
     設定區
     1. GUILD_NAME：網站標題
     2. FIREBASE_CONFIG：貼上 Firebase 專案設定。留 null 就是「預覽模式」，
        資料只存在目前這台電腦的瀏覽器，登入密碼輸入 demo 即可。
     最高管理員的 Email 只寫在 Firebase 的資料庫規則裡（不會出現在網頁原始碼）。
     ========================================================= -->
<script>
const GUILD_NAME = "Wolf Pack";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAR1myFU8lPz3mdY4Bj9WH9pLy27Lpavuo",
  authDomain: "lineagew-be2a7.firebaseapp.com",
  projectId: "lineagew-be2a7",
  storageBucket: "lineagew-be2a7.firebasestorage.app",
  messagingSenderId: "703152091139",
  appId: "1:703152091139:web:383817afed33e059501e36"
};
/* 例：
const FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "xxx.firebaseapp.com", projectId: "xxx",
  storageBucket: "xxx.appspot.com", messagingSenderId: "...", appId: "..."
};
*/
</script>

<script src="https://cdn.jsdelivr.net/npm/jodit@4.17.1/es2021/jodit.fat.min.js"></script>
<script>
(async function(){
"use strict";
document.getElementById('siteTitle').textContent = GUILD_NAME;
document.title = GUILD_NAME;
document.getElementById('foot').textContent = GUILD_NAME+' · 內容由管理員維護';

const TABS = [
  {id:'news',    name:'公告頁',          kind:'posts'},
  {id:'rules',   name:'標裝限制',        kind:'thread'},
  {id:'roster',  name:'人員名單',        kind:'page'},
  {id:'enemies', name:'敵人警誡名單',    kind:'thread'},
  {id:'items',   name:'各項補助商品報名', kind:'items'},
  {id:'links',   name:'連結分享',        kind:'thread'},
];
const MAX_DOC = 900*1024; // Firestore 單筆上限約 1MB

/* ---------------- 資料層 ---------------- */
function loadScript(src){return new Promise((ok,err)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=err;document.head.appendChild(s);});}

async function makeFirebaseStore(cfg){
  const v='12.19.0', base=`https://cdn.jsdelivr.net/npm/firebase@${v}/`;
  await loadScript(base+'firebase-app-compat.js');
  await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-firestore-compat.js')]);
  firebase.initializeApp(cfg);
  const db=firebase.firestore(), auth=firebase.auth();
  const snapList = q => q.onSnapshot.bind(q);
  const docs = s => s.docs.map(d=>({id:d.id,...d.data()}));
  return {
    demo:false,
    onAuth(cb){auth.onAuthStateChanged(u=>cb(u?{email:(u.email||'').toLowerCase(),verified:u.emailVerified}:null));},
    login(e,p){return auth.signInWithEmailAndPassword(e,p);},
    googleLogin(){return auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());},
    async register(e,p){const c=await auth.createUserWithEmailAndPassword(e,p);await c.user.sendEmailVerification();},
    resendVerify(){return auth.currentUser&&auth.currentUser.sendEmailVerification();},
    async reloadUser(){await auth.currentUser.reload();await auth.currentUser.getIdToken(true);const u=auth.currentUser;return{email:(u.email||'').toLowerCase(),verified:u.emailVerified};},
    resetPw(e){return auth.sendPasswordResetEmail(e);},
    watchAdmins(cb){return db.collection('admins').onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,owner:!!d.data().owner,nickname:d.data().nickname||''}))),()=>cb([]));},
    // 只有最高管理員能寫 admins（由資料庫規則決定），寫得進去就代表是最高管理員
    async probeOwner(e){try{await db.doc('admins/'+e).set({owner:true,addedAt:Date.now()},{merge:true});return true;}catch{return false;}},
    addAdmin(e,by,nick){return db.doc('admins/'+e).set({addedBy:by,addedAt:Date.now(),nickname:nick||''});},
    setNick(e,n){return db.doc('admins/'+e).set({nickname:n},{merge:true});},
    async renameAuthor(o,n){ for(const c of ['posts','items','pages']){ const q=await db.collection(c).where('updatedBy','==',o).get(); for(const d of q.docs) await d.ref.update({updatedBy:n}); } },
    removeAdmin(e){return db.doc('admins/'+e).delete();},
    logout(){return auth.signOut();},
    watchPage(id,cb){return db.doc('pages/'+id).onSnapshot(s=>cb(s.exists?s.data():null),e=>cb(null,e));},
    savePage(id,data){return db.doc('pages/'+id).set({...data,updatedAt:Date.now()});},
    watchColl(name,cb){return db.collection(name).onSnapshot(s=>cb(docs(s)),e=>cb([],e));},
    add(name,data){return db.collection(name).add({...data,createdAt:Date.now()});},
    update(name,id,data){return db.collection(name).doc(id).update(data);},
    remove(name,id){return db.collection(name).doc(id).delete();},
  };
}

function makeDemoStore(){
  const KEY='guild-demo-v1';
  let state; try{state=JSON.parse(localStorage.getItem(KEY))||{};}catch{state={};}
  state.pages=state.pages||{}; state.admins=state.admins||{}; state.posts=state.posts||{}; state.items=state.items||{}; state.signups=state.signups||{};
  let user=null; try{user=JSON.parse(sessionStorage.getItem(KEY+'-u'));}catch{}
  const subs=new Set(), authSubs=new Set();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){say('預覽模式的瀏覽器空間已滿（圖片太大）。');throw e;}subs.forEach(f=>f());};
  const list=n=>Object.entries(state[n]).map(([id,v])=>({id,...v}));
  const sub=f=>{subs.add(f);f();return()=>subs.delete(f);};
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  return {
    demo:true,
    onAuth(cb){authSubs.add(cb);cb(user);},
    async login(e,p){ if(p!=='demo') throw new Error('預覽模式密碼是 demo'); e=e.toLowerCase(); if(!state.owner){state.owner=e;save();} user={email:e,verified:true}; try{sessionStorage.setItem(KEY+'-u',JSON.stringify(user));}catch{} authSubs.forEach(f=>f(user)); },
    async register(e,p){ return this.login(e,'demo'); },
    async googleLogin(){ return this.login('google@demo','demo'); },
    async resendVerify(){}, async reloadUser(){return user;}, async resetPw(){},
    async probeOwner(e){return state.owner===e;},
    watchAdmins(cb){state.nicks=state.nicks||{};return sub(()=>cb([...Object.keys(state.admins).map(id=>({id,owner:false,nickname:state.nicks[id]||''})),...(state.owner?[{id:state.owner,owner:true,nickname:state.nicks[state.owner]||''}]:[])]));},
    async addAdmin(e,by,nick){state.admins[e]={addedBy:by,addedAt:Date.now()};state.nicks=state.nicks||{};state.nicks[e]=nick||'';save();},
    async setNick(e,n){state.nicks=state.nicks||{};state.nicks[e]=n;save();},
    async renameAuthor(o,n){for(const c of ['posts','items','pages'])for(const v of Object.values(state[c]))if(v.updatedBy===o)v.updatedBy=n;save();},
    async removeAdmin(e){delete state.admins[e];save();},
    async logout(){ user=null; try{sessionStorage.removeItem(KEY+'-u');}catch{} authSubs.forEach(f=>f(null)); },
    watchPage(id,cb){return sub(()=>cb(state.pages[id]||null));},
    async savePage(id,data){state.pages[id]={...data,updatedAt:Date.now()};save();},
    watchColl(n,cb){return sub(()=>cb(list(n)));},
    async add(n,data){state[n][uid()]={...data,createdAt:Date.now()};save();},
    async update(n,id,data){state[n][id]={...state[n][id],...data};save();},
    async remove(n,id){delete state[n][id];save();},
  };
}

let store;
try{ store = FIREBASE_CONFIG ? await makeFirebaseStore(FIREBASE_CONFIG) : makeDemoStore(); }
catch(e){ document.getElementById('main').innerHTML='<div class="card">無法連線到資料庫，請稍後重新整理。</div>'; console.error(e); return; }

/* ---------------- 工具 ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs={},...kids)=>{const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')el.className=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)el.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c));}return el;};
function ask(msg,{okOnly=false}={}){
  return new Promise(res=>{
    const d=$('#askDlg'); $('#askMsg').textContent=msg; $('#askNo').hidden=okOnly;
    const done=v=>{d.close();$('#askOk').onclick=$('#askNo').onclick=d.oncancel=null;res(v);};
    $('#askOk').onclick=()=>done(true); $('#askNo').onclick=()=>done(false); d.oncancel=e=>{e.preventDefault();done(false);};
    d.showModal();
  });
}
const say=msg=>ask(msg,{okOnly:true});
const fmt=t=>{if(!t)return'';const d=new Date(t);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
/* Google 試算表連結：在連結下方直接嵌入表格（試算表要設成「知道連結的人都能檢視」） */
function embedSheets(root){
  const seen=new Set();
  root.querySelectorAll('a[href*="docs.google.com/spreadsheets/d/"]').forEach(a=>{
    const m=a.href.match(/docs\.google\.com\/spreadsheets\/d\/([A-Za-z0-9_-]{20,})/); if(!m||seen.has(m[1])) return; seen.add(m[1]);
    const gid=(a.href.match(/[#&?]gid=(\d+)/)||[])[1];
    const src=`https://docs.google.com/spreadsheets/d/${m[1]}/preview${gid?'?gid='+gid:''}`;
    const box=h('div',{class:'sheet-embed'},h('iframe',{src,loading:'lazy',title:'Google 試算表'}),
      h('div',{class:'meta'},h('a',{href:a.href,target:'_blank',rel:'noopener'},'在 Google 試算表開啟 ↗')));
    const block=a.closest('p,div,li,td')||a; (block===root?a:block).after(box);
  });
}

const bytes=s=>new Blob([s||'']).size;

/* 圖片上傳：自動縮到最寬 1200px、轉 JPEG，避免資料太大 */
/* 儲存前自動壓縮內容裡的圖片（貼上、拖曳、任何方式放進來的都算），直到大小放得進資料庫 */
function shrinkDataUrl(src,max,q){
  return new Promise(ok=>{
    const img=new Image();
    img.onload=()=>{ const s=Math.min(1,max/img.width); const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      const out=c.toDataURL('image/jpeg',q); ok(out.length<src.length?out:src); };
    img.onerror=()=>ok(src); img.src=src;
  });
}
async function shrinkHtml(html){
  if(bytes(html)<=MAX_DOC*0.6 && !/src="data:image\/(png|bmp|gif|webp)/.test(html)) return html;
  const steps=[[1600,.85],[1400,.78],[1200,.72],[1000,.65],[800,.6]];
  let out=html;
  for(const [max,q] of steps){
    const t=document.createElement('template'); t.innerHTML=out;
    const imgs=[...t.content.querySelectorAll('img[src^="data:image"]')].filter(i=>i.getAttribute('src').length>60000);
    if(!imgs.length) break;
    for(const i of imgs) i.setAttribute('src',await shrinkDataUrl(i.getAttribute('src'),max,q));
    out=t.innerHTML;
    if(bytes(out)<=MAX_DOC) break;
  }
  return out;
}
function compressImage(file){
  return new Promise((ok,err)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600, s=Math.min(1,max/img.width);
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      const isPng=file.type==='image/png'&&c.width*c.height<300*300;
      ok(c.toDataURL(isPng?'image/png':'image/jpeg',0.8));
    };
    img.onerror=err; img.src=url;
  });
}

  const open=withDeadline?h('input',{type:'checkbox'}):null; if(open) open.checked=initial?initial.open!==false:true;
  const bg=h('input',{type:'color',value:initial?.bg||'#fffdf8'});
  const host=h('div'), msg=h('div',{class:'msg'});

    msg.className='msg'; msg.textContent='處理圖片中…';
    const html=await shrinkHtml(editing.value), t=tIn.value.trim();
    if(!t){msg.className='msg err';msg.textContent='請填標題';return;}
    if(bytes(html)>MAX_DOC){msg.className='msg err';msg.textContent='內容太大（多半是圖片太多或太大），請刪掉幾張圖再存。';return;}
    const data={title:t,html,bg:bg.value,updatedBy:myName(),updatedAt:Date.now()};
    if(pin) data.pinned=pin.checked;
    if(dl){data.deadline=dl.value;data.open=open.checked;}
    save.disabled=true; msg.className='msg'; msg.textContent='儲存中…';
    try{ await onSave(data); editing.destruct(); editing=null; onCancel(); }
    catch(e){ save.disabled=false; msg.className='msg err'; msg.textContent='儲存失敗：'+(e.message||e); }
  }},'儲存');
  const opts=h('div',{class:'inline'});
  if(pin) opts.append(h('label',{},pin,'置頂'));
  if(dl) opts.append(h('label',{},'截止日 ',dl),h('label',{},open,'開放報名'));
  opts.append(h('label',{},'內容底色 ',bg));
  box.append(h('div',{class:'head-row'},h('h2',{},heading)),
    h('div',{class:'card'},h('div',{class:'field'},h('label',{},title),tIn),opts,h('div',{class:'editor-wrap'},host),
      h('div',{class:'actions'},save,h('button',{class:'btn',onclick:async()=>{if(await ask('放棄這次的修改？')){editing.destruct();editing=null;onCancel();}}},'取消')),msg));

}

  let posts=[], intro=null, openSet=new Set(), allOpen=false;
  const ordered=()=>[...posts].sort((a,b)=>(a.order??a.createdAt??0)-(b.order??b.createdAt??0));

    const list=ordered();
    list.forEach((p,i)=>{
      const det=h('details',{class:'card thread',open:openSet.has(p.id)});
      det.addEventListener('toggle',()=>{det.open?openSet.add(p.id):openSet.delete(p.id);});
      det.append(h('summary',{},h('span',{class:'th-title'},p.title),h('span',{class:'meta'},fmt(p.updatedAt||p.createdAt)+byLine(p.updatedBy))));

        h('button',{class:'btn sm',disabled:i===0,onclick:()=>move(list,i,-1)},'上移'),
        h('button',{class:'btn sm',disabled:i===list.length-1,onclick:()=>move(list,i,1)},'下移'),
        h('button',{class:'btn sm danger',onclick:async()=>{if(await ask(`刪除「${p.title}」？`))await store.remove('posts',p.id);}},'刪除')));
      box.append(det);

    box.replaceChildren();

      save.disabled=true; msg.textContent='儲存中…';

    editing=makeEditor(host,intro?.html);

    const a=list[i], b=list[i+d]; if(!b) return;
    const oa=a.order??a.createdAt??0, ob=b.order??b.createdAt??0;

    const today=new Date().toISOString().slice(0,10);
    [...items].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(it=>{
      const expired=it.deadline&&it.deadline<today;
      const isOpen=it.open!==false&&!expired;
      const mine=signups.filter(s=>s.itemId===it.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      const c=h('div',{class:'card'},
        h('h3',{},it.title,h('span',{class:'tag'+(isOpen?' open':'')},isOpen?'報名中':'已截止')),
        h('div',{class:'meta'},it.deadline?`截止日 ${it.deadline}`:'未設截止日'),
        richBox(it.html,it.bg));
      if(isOpen){
        const nm=h('input',{type:'text',placeholder:'遊戲角色名稱',maxlength:40,'aria-label':'遊戲角色名稱'});
        const nt=h('input',{type:'text',placeholder:'備註（選填，例如數量、職業）',maxlength:200,'aria-label':'備註'});
        const msg=h('div',{class:'msg'});
        const btn=h('button',{class:'btn primary',type:'submit'},'我要報名');
        const f=h('form',{class:'signup-form',onsubmit:async e=>{
          e.preventDefault(); const n=nm.value.trim(); if(!n){msg.className='msg err';msg.textContent='請填角色名稱';return;}
          if(mine.some(s=>s.name===n)){msg.className='msg err';msg.textContent='這個角色已經報名過了';return;}
          btn.disabled=true; flash[it.id]=`${n} 報名成功！`;
          try{ await store.add('signups',{itemId:it.id,name:n,note:nt.value.trim()}); }
          catch(err){ delete flash[it.id]; btn.disabled=false; msg.className='msg err'; msg.textContent='報名失敗：'+(err.message||err); return; }
        }},nm,nt,btn);
        c.append(f,msg);
        if(flash[it.id]){msg.className='msg ok';msg.textContent=flash[it.id];delete flash[it.id];}
      }
      const list=h('div',{class:'list'});
      const lh=h('div',{class:'list-head'},h('span',{},`已報名 ${mine.length} 人`));
      if(isAdmin()&&mine.length) lh.append(h('button',{class:'btn sm',onclick:()=>csv(it,mine)},'下載名單 (CSV)'));
      list.append(lh);
      if(mine.length){
        const tb=h('tbody');
        mine.forEach((s,i)=>tb.append(h('tr',{},h('td',{},String(i+1)),h('td',{},s.name),h('td',{},s.note||''),h('td',{},fmt(s.createdAt)),
          isAdmin()?h('td',{},h('button',{class:'btn sm danger',onclick:async()=>{if(await ask(`移除 ${s.name} 的報名？`))await store.remove('signups',s.id);}},'移除')):null)));
        list.append(h('table',{class:'sl'},h('thead',{},h('tr',{},h('th',{},'#'),h('th',{},'角色名稱'),h('th',{},'備註'),h('th',{},'時間'),isAdmin()?h('th',{}):null)),tb));
      }
      c.append(list);
      if(isAdmin()) c.append(h('div',{class:'actions'},
        h('button',{class:'btn sm',onclick:()=>edit(it)},'編輯項目'),
        h('button',{class:'btn sm',onclick:()=>store.update('items',it.id,{open:it.open===false})},it.open===false?'重新開放':'關閉報名'),
        h('button',{class:'btn sm danger',onclick:async()=>{if(await ask(`刪除「${it.title}」？報名資料也會一起刪除。`)){for(const s of mine)await store.remove('signups',s.id);await store.remove('items',it.id);}}},'刪除項目')));
      box.append(c);
    });
  };
  const flash={};
  const edit=it=>itemEditor(box,{title:'項目名稱',heading:it?'編輯報名項目':'新增報名項目',initial:it,withDeadline:true,
    onSave:d=>it?store.update('items',it.id,d):store.add('items',d),onCancel:draw});
  const csv=(it,rows)=>{
    const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const text='﻿'+[['#','角色名稱','備註','時間'],...rows.map((s,i)=>[i+1,s.name,s.note,fmt(s.createdAt)])].map(r=>r.map(esc).join(',')).join('\r\n');
    const a=h('a',{href:URL.createObjectURL(new Blob([text],{type:'text/csv'})),download:`${it.title}-報名名單.csv`}); document.body.append(a); a.click(); a.remove();
  };
  unsub.push(store.watchColl('items',d=>{items=d;draw();}));
  unsub.push(store.watchColl('signups',d=>{signups=d;draw();}));
}

/* ---- 管理員設定（只有最高管理員看得到） ---- */
function adminsView(box){
  const draw=()=>{
    box.replaceChildren();
    const em=h('input',{type:'email',placeholder:'新管理員的 Email',required:true,'aria-label':'Email'});
    const nk=h('input',{type:'text',placeholder:'顯示暱稱（例如遊戲角色名）',maxlength:20,'aria-label':'暱稱'});
    const msg=h('div',{class:'msg'});
    const f=h('form',{class:'signup-form',onsubmit:async e=>{
      e.preventDefault(); const v=em.value.trim().toLowerCase();
      if(v===ownerEmail()||admins.includes(v)){msg.className='msg err';msg.textContent='這個 Email 已經是管理員了';return;}
      try{await store.addAdmin(v,myName(),nk.value.trim());msg.className='msg ok';msg.textContent=`已新增 ${v}。請對方打開網站 → 管理員登入 → 「第一次使用？設定密碼」。`;}
      catch(err){msg.className='msg err';msg.textContent='新增失敗：'+(err.message||err);}
    }},em,nk,h('button',{class:'btn primary',type:'submit'},'新增管理員'));
    const tb=h('tbody');
    const nickCell=a=>{
      const inp=h('input',{type:'text',value:nicks[a]||'',placeholder:'未設定',maxlength:20,style:'width:100%;min-width:90px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px','aria-label':'暱稱'});
      const b=h('button',{class:'btn sm',onclick:async()=>{b.disabled=true;const old=nicks[a]||'', nw=inp.value.trim();try{await store.setNick(a,nw);if(old&&nw&&old!==nw)await store.renameAuthor(old,nw);b.textContent='已儲存';}catch(err){b.textContent='失敗';}setTimeout(()=>{b.disabled=false;b.textContent='儲存';},1500);}},'儲存');
      return h('td',{},h('div',{style:'display:flex;gap:6px'},inp,b));
    };
    const lastCell=a=>{const td=h('td',{class:'meta',style:'white-space:nowrap'},'…');emailKey(a).then(k=>{td.textContent=logins[k]?fmt(logins[k]):'尚未登入';});return td;};
    tb.append(h('tr',{},h('td',{},ownerEmail()),nickCell(ownerEmail()),h('td',{},'最高管理員'),lastCell(ownerEmail()),h('td',{})));
    admins.filter(a=>a!==ownerEmail()).sort().forEach(a=>tb.append(h('tr',{},h('td',{},a),nickCell(a),h('td',{},'管理員'),lastCell(a),
      h('td',{},h('button',{class:'btn sm danger',onclick:async()=>{if(await ask(`移除 ${a} 的管理員權限？`))await store.removeAdmin(a);}},'移除')))));
    box.append(h('div',{class:'head-row'},h('h2',{},'管理員設定')),
      h('div',{class:'card'},h('p',{class:'meta',style:'margin:0'},'被新增的人用同一個 Email 在網站「管理員登入 → 第一次使用？設定密碼」自己設定密碼，收到驗證信點連結後就能編輯（或直接用 Google 帳號登入）。移除後對方立刻失去編輯權限。公告和頁面上只會顯示暱稱，不會顯示 Email。'),f,msg,
        h('div',{style:'overflow-x:auto;margin-top:14px'},h('table',{class:'sl'},h('thead',{},h('tr',{},h('th',{},'Email'),h('th',{},'顯示暱稱'),h('th',{},'身分'),h('th',{},'最後登入'),h('th',{}))),tb))));
  };
  let logins={};
  draw();
  const off=store.watchAdmins(()=>draw()); unsub.push(off);
  unsub.push(store.watchPage('_logins',d=>{logins=d||{};draw();}));
}

/* ---------------- 登入 ---------------- */
let lgMode='login';
function openLogin(mode){
  lgMode=mode; const reg=mode==='register';
  $('#lgTitle').textContent=reg?'第一次使用：設定密碼':'管理員登入';
  $('#lgSubmit').textContent=reg?'建立並寄驗證信':'登入';
  $('#lgToReg').textContent=reg?'已經有密碼？回到登入':'第一次使用？設定密碼';
  $('#lgPw').autocomplete=reg?'new-password':'current-password'; $('#lgPw').minLength=(reg&&!store.demo)?6:0;
  $('#lgErr').textContent=''; $('#lgErr').className='msg';
  if(!$('#loginDlg').open) $('#loginDlg').showModal();
}
$('#lgGoogle').onclick=async()=>{
  const m=$('#lgErr'); m.className='msg err'; m.textContent='';
  try{ await store.googleLogin(); $('#loginDlg').close(); }
  catch(err){ const c=err.code||'';
    m.textContent = c.includes('popup-closed')||c.includes('cancelled-popup') ? ''
      : c.includes('unauthorized-domain') ? '這個網址還沒加進 Firebase 的「已授權網域」。'
      : c.includes('operation-not-allowed') ? 'Firebase 還沒開啟 Google 登入。'
      : c.includes('popup-blocked') ? '登入視窗被瀏覽器擋住了，請允許彈出視窗後再試。'
      : 'Google 登入失敗：'+(err.message||c); }
};
$('#lgToReg').onclick=e=>{e.preventDefault();openLogin(lgMode==='register'?'login':'register');};
$('#lgForgot').onclick=async e=>{
  e.preventDefault(); const em=$('#lgEmail').value.trim(); const m=$('#lgErr');
  if(!em){m.className='msg err';m.textContent='請先在上面填 Email';return;}
  try{await store.resetPw(em);m.className='msg ok';m.textContent='如果這個 Email 有帳號，重設密碼的信已寄出。';}catch{m.className='msg err';m.textContent='寄送失敗，請確認 Email。';}
};
$('#lgCancel').onclick=()=>$('#loginDlg').close();
$('#loginForm').onsubmit=async e=>{
  e.preventDefault(); const m=$('#lgErr'); m.className='msg err'; m.textContent='';
  const em=$('#lgEmail').value.trim(), pw=$('#lgPw').value;
  try{
    if(lgMode==='register') await store.register(em,pw); else await store.login(em,pw);
    $('#loginDlg').close(); $('#lgPw').value='';
  }catch(err){
    const c=err.code||'';
    m.textContent= store.demo ? err.message
      : c.includes('email-already-in-use') ? '這個 Email 已經設定過密碼，請直接登入（忘記的話按「忘記密碼」）。'
      : c.includes('weak-password') ? '密碼至少 6 個字元。'
      : c.includes('too-many-requests') ? '嘗試太多次，請稍後再試。'
      : lgMode==='register' ? '設定失敗：'+(err.message||c) : '登入失敗，請確認 Email 和密碼。';
  }
};

window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue='';}});
let adminsKey='';
let adminsOff=null;
/* 最後登入時間：存在 pages/_logins，用 Email 的雜湊當鍵，公開資料裡不會出現 Email */
const emailKey=async e=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('wolfpack:'+e));return 'k'+[...new Uint8Array(b)].slice(0,12).map(x=>x.toString(16).padStart(2,'0')).join('');};
let loginRecorded=false;
async function recordLogin(){ if(loginRecorded||!isAdmin()) return; loginRecorded=true;
  try{ const k=await emailKey(me.email); const cur=(await new Promise(r=>{const off=store.watchPage('_logins',d=>{r(d||{});setTimeout(()=>{try{off()}catch{}});});}));
    await store.savePage('_logins',{...cur,[k]:Date.now()}); }catch(e){ console.warn('login time',e); } }
function watchAdmins(){
  if(adminsOff){try{adminsOff()}catch{} adminsOff=null;} admins=[];
  if(!me||!me.verified) return;
  store.probeOwner(me.email);
  adminsOff=store.watchAdmins(list=>{ admins=list.map(x=>x.id.toLowerCase()); nicks=Object.fromEntries(list.map(x=>[x.id.toLowerCase(),x.nickname||''])); ownerId=(list.find(x=>x.owner)?.id||'').toLowerCase(); renderWho(); recordLogin(); const k=String(isAdmin())+isOwner(); if(k!==adminsKey){adminsKey=k; renderTabs(); if(!editing) renderMain();} });
}
store.onAuth(u=>{ const changed=JSON.stringify(u)!==JSON.stringify(me); if(changed) loginRecorded=false; me=u; watchAdmins(); adminsKey=String(isAdmin())+isOwner(); renderTabs(); renderWho(); if(changed||!$('#main').childElementCount){ if(editing){try{editing.destruct()}catch{} editing=null;} renderMain(); } });
renderTabs();
})();
</script>
